[package]
name = "dv-report-substrate-client"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
kusama = ["dv-report-metadata/kusama"]
polkadot = ["dv-report-metadata/polkadot"]

[dependencies]
anyhow = { workspace = true }
frame-metadata = { workspace = true, features = ["default"] }
dv-report-metadata = { path = "../dv-report-metadata" }
dv-report-types = { path = "../dv-report-types" }
hex = { workspace = true }
jsonrpsee = { workspace = true, features = ["full"] }
jsonrpsee-core = { workspace = true }
log = { workspace = true }
parity-scale-codec = { workspace = true }
sp-core = { workspace = true }
subxt = { workspace = true, features = ["reconnecting-rpc-client"] }