        - $ref: '#/components/parameters/MinBlockNumber'
        - $ref: '#/components/parameters/MaxBlockNumber'
        - $ref: '#/components/parameters/MinBlockTimestamp'
        - $ref: '#/components/parameters/MaxBlockTimestamp'
        - $ref: '#/components/parameters/MinSpecVersion'
        - $ref: '#/components/parameters/MaxSpecVersion'
        - $ref: '#/components/parameters/PalletName'
        - $ref: '#/components/parameters/PalletCallName'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedCallList'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /calls/{id}:
    get:
      summary: Get call by id
      description: Returns a call by its database id.
      operationId: getCallById
      tags:
        - call
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          $ref: '#/components/schemas/Call'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /events:
    get:
      summary: Get events
      description: >
        Returns all events from the database that satisfy the query parameters.
        It will return a paginated response, ordered descending by block number, then ascending event index.
      operationId: getEvents
      tags:
        - event
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/MinBlockNumber'
        - $ref: '#/components/parameters/MaxBlockNumber'
        - $ref: '#/components/parameters/MinBlockTimestamp'
        - $ref: '#/components/parameters/MaxBlockTimestamp'
        - $ref: '#/components/parameters/MinSpecVersion'
        - $ref: '#/components/parameters/MaxSpecVersion'
        - $ref: '#/components/parameters/PalletName'
        - $ref: '#/components/parameters/PalletEventName'
      responses:
