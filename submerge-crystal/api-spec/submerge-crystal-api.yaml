          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /events/{id}:
    get:
      summary: Get event by id
      description: Returns an event by its database id.
      operationId: getEventById
      tags:
        - event
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          $ref: '#/components/schemas/Event'
