openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Submerge Crystal API v1
  description: |
    REST API for Submerge Crystal, the core indexer component of Submerge.
    Submerge API endpoints are grouped under five resource sets:
    - Blocks
    - Calls
    - Events
    - Extrinsics
    - Genesis
    - Metadata
    - System
    - Traces
    
    Public API is limited by 5 requests per second.
    Request query parameters use `snake_case`; response fields use `camelCase`.
  version: 1.0.0
  contact:
    name: Helikon Labs
    url: https://submerge.io
    email: info@helikon.io
  license:
    name: GPLv3
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: http://localhost:3030/v1
    description: Local development API.
  - url: https://{chain}.api.crystal.submerge.io/v1
    description: Production API.
    variables:
      chain:
        default: polkadot
        enum:
          - polkadot
          - asset-hub-polkadot
          - bridge-hub-polkadot
          - collectives-polkadot
          - coretime-polkadot
          - people-polkadot
          - kusama
          - asset-hub-kusama
          - bridge-hub-kusama
          - coretime-kusama
          - people-kusama

tags:
  - name: block
    description: Endpoints related to blocks.
  - name: call
    description: Endpoints related to calls in extrinsics.
  - name: event
    description: Endpoints related to events.
  - name: extrinsic
    description: Endpoints related to extrinsics.
  - name: genesis
    description: Endpoints related to genesis records.
  - name: metadata
    description: Endpoints related to metadata.
  - name: trace
    description: Endpoints related to block traces.
  - name: system
    description: System-related endpoints.

components:
  headers:
    X-RateLimit-Limit:
      description: Max requests allowed in the current window.
      schema:
        type: integer
        minimum: 1
    X-RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        minimum: 0
    X-RateLimit-Reset:
      description: Epoch seconds when the window resets.
      schema:
        type: integer
        format: int64
        minimum: 0
    X-Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  schemas:
    Error:
      type: object
      description: Generic error type.
      properties:
        message:
          type: string
          description: Error message.
          example: Internal server error.
      required:
        - message
      example:
        message: Internal server error.
    WorkerStatus:
      type: object
      description: Current status of a single indexer worker.
      required: [id, state, from, to, current, blocksPerSec]
      properties:
        id:
          type: string
          description: Machine-assigned id of the worker.
        state:
          type: string
          descriotion: Worker state.
          enum: [idle, indexing, paused, error, stopping]
        from:
          type: integer
          format: int64
          description: Start block number.
          minimum: 0
        to:
          type: integer
          format: int64
          description: Target block number.
          minimum: 0
        current:
          type: integer
          format: int64
          description: Current block number being indexed.
          minimum: 0
        blocksPerSec:
          type: number
          description: Indexing speed of the worker.
          minimum: 0
      example:
        id: 'crystal-worker-3'
        state: indexing
        from: 0
        to: 15243769
        current: 3102
        blocksPerSec: 15
    ServiceInfo:
      type: object
      description: Basic indexer information.
      required: [name, version, uptimeSeconds, startedAt, chain]
      properties:
        name:
          type: string
          description: Instance name.
          example: 'Submerge Crystal'
        version:
          type: string
          description: Version of the Crystal binary.
          example: '1.0.0'
        uptimeSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 62
        startedAt:
          type: integer
          format: int64
          description: Start time epoch milliseconds.
          example: 1756009805000
        chain:
          type: string
          description: Blockchain name.
          example: polkadot
      example:
        name: 'submerge-crystal-01'
        version: '1.0.0'
        uptimeSeconds: 62
        startedAt: 1756009805000
        chain: 'polkadot'
    ServiceHealth:
      type: object
      description: Service health summary.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
        reason:
          type:
            - 'null'
            - string
          description: Short reason for non-OK states.
      example:
        status: ok
    BlockSummary:
      type: object
      required: [number, hash, parentHash, timestamp]
      description: Basic information about a block.
      properties:
        number:
          type: integer
          format: int64
          minimum: 0
        hash:
          $ref: '#/components/schemas/Hash256Hex'
        parentHash:
          $ref: '#/components/schemas/Hash256Hex'
        timestamp:
          type: integer
          format: int64
          description: Block timestamp.
          minimum: 0
      example:
        number: 29793989
        hash: '0x504303740c518bbffb81efbac64974e5dbb90640e364e7606bdc2e4b5fbac1c3'
        parentHash: '0x056c65c83840f75140aadc78d1e9fa604b73ab8b5db684f64774293434b9d6b3'
        timestamp: 1756009805000
    IndexerTip:
      type: object
      description: The last best and finalized blocks received and written/committed by Crystal.
      required: [best, finalized, indexed]
      properties:
        best:
          description: Current best block on the blockchain.
          $ref: '#/components/schemas/BlockSummary'
        finalized:
          description: Current finalized block on the blockchain.
          $ref: '#/components/schemas/BlockSummary'
        indexed:
          type: object
          description: What Crystal has fully written/committed locally.
          required: [best, finalized]
          properties:
            best:
              description: Latest best block indexed by Crystal.
              $ref: '#/components/schemas/BlockSummary'
            finalized:
              description: Latest finalized block indexed by Crystal.
              $ref: '#/components/schemas/BlockSummary'
    PaginationData:
      type: object
      description: Pagination data for paged responses.
      properties:
        page:
          type: integer
          description: Current page number.
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
          example: 25
        total:
          type: integer
          description: Total number of items across all pages.
          minimum: 0
          example: 78
      required:
        - page
        - pageSize
        - total
      example:
        page: 1
        pageSize: 25
        total: 78
    HexString:
      type: string
      description: Arbitrary hex-encoded bytes. Lowercase, even length, `0x`-prefixed.
      pattern: '^0x(?:[0-9a-f]{2})+$'
      examples:
        - "0xdeadbeef"
        - "0x0123456789abcdef"
    HexStringLoose:
      type: string
      description: >
        Arbitrary hex-encoded bytes. Lowercase, odd or even length, `0x`-prefixed.
      pattern: '^0x(?:[0-9a-f])+$'
      examples:
        - '0xdeadbeef'
        - '0x0123456789abcdef'
    AccountIdHex:
      type: string
      pattern: '^0x[a-f0-9]{64}$'
      description: >
        32-byte Substrate account id, **always** `0x`-prefixed and lowercase in responses.
        Inputs elsewhere may accept mixed case or missing `0x`; the API normalizes outputs.
      example: '0x008d8404893c7b4b80f397605cc96e61fec3c89676c8c2794a2a7d281d678b1a'
    Hash256Hex:
      type: string
      pattern: '^0x[a-f0-9]{64}$'
      description: >
        32-byte Blake2b-256, **always** `0x`-prefixed and lowercase in responses.
        Inputs elsewhere may accept mixed case or missing `0x`; the API normalizes outputs.
      example: '0x91b171bb158e2d3848fa23a9f1c25182fb8e20313b2c1eb49219da7a70ce90c3'
    SignatureHex:
      type: string
      description: >
        Hex-encoded Substrate extrinsic signature. Supports Sr25519/Ed25519 (64 bytes → 128 hex chars)
        and ECDSA (65 bytes → 130 hex chars). **Always** `0x`-prefixed and lowercase in responses.
        Inputs elsewhere may accept mixed case or missing `0x`; the API normalizes outputs.
      pattern: '^0x([0-9a-f]{128}|[0-9a-f]{130})$'
      examples:
        - "0xabababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababab"
        - "0xababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababab"
    MultiAddress:
      description: Discriminated union for the Substrate multiaddress type. The `type` tag selects the variant; `value` carries the payload.
      oneOf:
        - $ref: '#/components/schemas/MultiAddress_AccountId'
        - $ref: '#/components/schemas/MultiAddress_Index'
        - $ref: '#/components/schemas/MultiAddress_Raw'
        - $ref: '#/components/schemas/MultiAddress_Address20'
        - $ref: '#/components/schemas/MultiAddress_Address32'
      discriminator:
        propertyName: type
        mapping:
          accountId: '#/components/schemas/MultiAddress_AccountId'
          index: '#/components/schemas/MultiAddress_Index'
          raw: '#/components/schemas/MultiAddress_Raw'
          address20: '#/components/schemas/Address20'
          address32: '#/components/schemas/Address32'
    MultiAddress_AccountId:
      type: object
      description: 32-byte account id.
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          type: string
          const: accountId
        value:
          $ref: '#/components/schemas/AccountIdHex'
    MultiAddress_Index:
      type: object
      description: Account index.
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          type: string
          const: index
        value:
          type: integer
          minimum: 0
      example:
        type: index
        value: 42
    MultiAddress_Raw:
      type: object
      description: Raw account address.
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          type: string
          const: raw
        value:
          type: string
          description: 0x-prefixed lowercase hex, even length (whole bytes).
          pattern: '^0x(?:[0-9a-f]{2})+$'
      example:
        type: raw
        value: '0xdeadbeef'
    MultiAddress_Address20:
      type: object
      description: 20-byte address.
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          type: string
          const: address20
        value:
          type: string
          description: 20-byte address as 0x-prefixed lowercase hex.
          pattern: '^0x[0-9a-f]{40}$'
      example:
        type: address20
        value: '0x00112233445566778899aabbccddeeff00112233'
    MultiAddress_Address32:
      type: object
      description: 32-byte address.
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          type: string
          const: address32
        value:
          type: string
          description: 32-byte address as 0x-prefixed lowercase hex.
          pattern: '^0x[0-9a-f]{64}$'
      example:
        type: address32
        value: '0x00112233445566778899aabbccddeeff001122338899aabbccddeeff00112233'
    BlockStatus:
      type: string
      enum: [proposed, finalized, pruned]
      description: >
        Block status.
        - `finalized`: Blocks that have been finalized on chain.
        - `proposed`: Blocks that have been authored but not yet finalized.
        - `pruned`: Blocks that have been removed or are no longer accessible.
    TraceMethod:
      type: string
      enum: [Put, ChildPut, ChildKill, ClearPrefix, ChildClearPrefix, Append, Genesis]
      description: Trace method.
    Block:
      type: object
      description: A block in the blockchain
      properties:
        hash:
          $ref: '#/components/schemas/Hash256Hex'
        parentHash:
          $ref: '#/components/schemas/Hash256Hex'
        stateRoot:
          $ref: '#/components/schemas/Hash256Hex'
        extrinsicRoot:
          $ref: '#/components/schemas/Hash256Hex'
        number:
          type: integer
          format: int64
          description: Block height.
          minimum: 0
          example: 20324123
        timestamp:
          type: integer
          format: int64
          description: Block timestamp - milliseconds.
          minimum: 0
          example: 1755773684012
        specVersion:
          type: integer
          minimum: 0
          description: Runtime spec version.
          example: 1001
        status:
          $ref: '#/components/schemas/BlockStatus'
        weight:
          type: object
          additionalProperties: true
          description: Block weight. Schema depends on runtime metadata. Example includes a version 1006001 Kusama weight.
        extrinsicCount:
          type: integer
          minimum: 0
          description: Number of extrinsics in the block.
          example: 3
        eventCount:
          type: integer
          minimum: 0
          description: Number of events in the block.
          example: 12
        authorAccountId:
          $ref: '#/components/schemas/AccountIdHex'
          description: Authoring validator account id.
      required:
        - hash
        - parentHash
        - stateRoot
        - extrinsicRoot
        - number
        - timestamp
        - specVersion
        - status
        - weight
        - extrinsicCount
        - eventCount
        - authorAccountId
      example:
        hash: '0xc82fe0d5752d42ae3d325f14206859f86cec7447f244d5b4bccfc2a00bd58df8'
        parentHash: '0x1615581259dd1ac45fea1b23406367ca79c9f6dfa3b3b1115517c6e86250c42b'
        stateRoot: '0x8c8b0b599733c41bad79a617d8f2f0213a5d965d287cee16c9efd65f23001603'
        extrinsicRoot: '0x7893dd573a5033a6d785bf4038c237cbd8e1f3730d177d4f9b21c8d2c7b34454'
        number: 27419831
        timestamp: 1755773684012
        specVersion: 1006001
        status: 'finalized'
        weight:
          normal:
            refTime: '0'
            proofSize: '0'
          mandatory:
            refTime: '701777135384'
            "proofSize": '204955'
          operational:
            refTime: '0'
            proofSize: '0'
        extrinsicCount: 2
        eventCount: 56
        authorAccountId: '0x269a84431cd8dfc5762beadfa54a8f21597c12d4f31e51f9f6f985f65ba0c626'
    Trace:
      type: object
      description: A trace record in a block.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Id of the trace record.
          example: 1
        blockHash:
          $ref: '#/components/schemas/Hash256Hex'
        blockParentHash:
          $ref: '#/components/schemas/Hash256Hex'
        blockNumber:
          type: integer
          format: int64
          description: Trace block height.
          minimum: 0
          example: 20324123
        specVersion:
          type: integer
          minimum: 0
          description: Trace runtime spec version.
          example: 1001
        index:
          type: integer
          description: Index of the trace record in the block.
          minimum: 0
          example: 23
        key:
          type: string
          description: Storage key (hex, 0x-prefixed).
          example: '0x26aa394eea5630e07c48ae0c9558cef7ff553b5a9862a516939d82b3d3d8661a'
        value:
          type:
            - 'null'
            - string
          description: Storage value (hex, 0x-prefixed). Can be odd-length.
          examples:
            - null
            - '0x02'
            - '0x9e44c0f852654f5750818ec680e04124e37b711deaa44e739e1d994729508168'
        extId:
          type: string
          description: External id in hex (may be empty). Can be odd-length.
          pattern: '^[0-9a-f]*$'
          examples: 
            - 'cafe'
            - 'ee54'
        method:
          $ref: '#/components/schemas/TraceMethod'
        parentId:
          $ref: '#/components/schemas/HexString'
          description: Parent storage id in hex format.
          nullable: true
      required:
        - id
        - blockHash
        - blockParentHash
        - blockNumber
        - specVersion
        - index
        - key
        - value
        - extId
        - method
      example:
        id: 2567824
        blockHash: '0xc82fe0d5752d42ae3d325f14206859f86cec7447f244d5b4bccfc2a00bd58df8'
        blockParentHash: '0x1615581259dd1ac45fea1b23406367ca79c9f6dfa3b3b1115517c6e86250c42b'
        blockNumber: 27419831
        specVersion: 1006001
        index: 0
        key: '0xab435260'
        value: '0x1435adde34ff94782a'
        extId: ''
        method: 'Put'
    Call:
      type: object
      description: A call in an extrinsic.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Database id of the call record.
          example: 1
        blockHash:
          $ref: '#/components/schemas/Hash256Hex'
        blockNumber:
          type: integer
          format: int64
          description: Call block height.
          minimum: 0
          example: 20324123
        blockTimestamp:
          type: integer
          format: int64
          description: Call block timestamp - milliseconds.
          minimum: 0
          example: 1755773684012
        specVersion:
          type: integer
          minimum: 0
          description: Call runtime spec version.
          example: 1001
        blockStatus:
          $ref: '#/components/schemas/BlockStatus'
        extrinsicId:
          type: integer
          format: int64
          minimum: 1
          description: Call extrinsic database id.
          example: 1
        extrinsicIndex:
          type: integer
          minimum: 0
          description: Call extrinsic index.
          example: 0
        extrinsicHash:
          $ref: '#/components/schemas/Hash256Hex'
        parentCallId:
          oneOf: [{ type: integer, minimum: 0, example: 175 }, { type: 'null' }]
          description: If a nested call, the call's parent call record id.
        nestingIndex:
          type: string
          description: A string representing the call path, using '::' as a delimiter and the index at each level.
          example: 'calls::0'
        palletIndex:
          type: integer
          minimum: 0
          description: Call's pallet index in the metadata.
          example: 0
        palletName:
          type: string
          description: Call's pallet name in the metadata - capital case.
          example: Balances
        palletCallIndex:
          type: integer
          minimum: 0
          description: Call's index in the pallet in the metadata.
          example: 0
        palletCallName:
          type: string
          description: Call's name in the pallet in the metadata - capital case.
          example: ForceTransfer
        isSuccessful:
          type: boolean
          description: Whether the call's extrinsic was successful.
        args:
          type: object
          additionalProperties: true
          description: Call arguments.
      required:
        - id
        - blockHash
        - blockNumber
        - blockTimestamp
        - specVersion
        - blockStatus
        - extrinsicId
        - extrinsicIndex
        - extrinsicHash
        - palletIndex
        - palletName
        - palletCallIndex
        - palletCallName
        - isSuccessful
        - args
      example:
        id: 1
        blockHash: '0x77d09455b5a5014cf8df62080f8a36aebd89f6dcec831c5acfb4444d07184b51'
        blockNumber: 29781585
        blockTimestamp: 1755935208000
        specVersion: 1006001
        blockStatus: finalized
        extrinsicId: 1
        extrinsicIndex: 0
        extrinsicHash: '0x5cffd6624df1b3447bc5aa9db09a414f7b5058ff1b7bc3c53ae564248924fa0a'
        palletIndex: 2
        palletName: 'Timestamp'
        palletCallIndex: 0
        palletCallName: 'Set'
        isSuccessful: true
        args:
          now: '1755935208000'
    Event:
      type: object
      description: An event in a block.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Id of the event record.
          example: 1
        blockHash:
          $ref: '#/components/schemas/Hash256Hex'
        blockNumber:
          type: integer
          format: int64
          description: Event block height.
          minimum: 0
          example: 29781585
        blockTimestamp:
          type: integer
          format: int64
          description: Event block timestamp - milliseconds.
          minimum: 0
          example: 1755935208000
        specVersion:
          type: integer
          minimum: 0
          description: Event runtime spec version.
          example: 1001
        blockStatus:
          $ref: '#/components/schemas/BlockStatus'
        traceIndex:
          type: integer
          minimum: 0
          description: Event trace index.
          example: 40
        palletIndex:
          type: integer
          minimum: 0
          description: Event's pallet index in the metadata.
          example: 0
        palletName:
          type: string
          description: Event's pallet name in the metadata - capital case.
          example: Balances
        palletEventIndex:
          type: integer
          minimum: 0
          description: Event's index in the pallet in the metadata.
          example: 0
        palletEventName:
          type: string
          description: Event's name in the pallet in the metadata - capital case.
          example: ForceTransfer
        extrinsicIndex:
          type: integer
          minimum: 0
          description: Event extrinsic index.
          example: 0
        extrinsicHash:
          $ref: '#/components/schemas/Hash256Hex'
        phase:
          type: string
          description: Event phase.
          example: ApplyExtrinsic
        index:
          type: integer
          minimum: 0
          description: Event index in block.
          example: 0
        args:
          type: object
          additionalProperties: true
          description: Event arguments.
      required:
        - id
        - blockHash
        - blockNumber
        - blockTimestamp
        - specVersion
        - blockStatus
        - traceIndex
        - palletIndex
        - palletName
        - palletEventIndex
        - palletEventName
        - extrinsicIndex
        - extrinsicHash
        - phase
        - index
        - args
      example:
        id: 392
        blockHash: '0x77d09455b5a5014cf8df62080f8a36aebd89f6dcec831c5acfb4444d07184b51'
        blockNumber: 25000005
        blockTimestamp: 1726829136000
        specVersion: 1003000
        blockStatus: finalized
        traceIndex: 324
        palletIndex: 53
        palletName: 'ParaInclusion'
        palletEventIndex: 3
        palletEventName: 'UpwardMessagesReceived'
        extrinsicIndex: 1
        extrinsicHash: '0x5cffd6624df1b3447bc5aa9db09a414f7b5058ff1b7bc3c53ae564248924fa0a'
        phase: ApplyExtrinsic
        index: 24
        args:
          from: '1005'
          count: '1'
    Extrinsic:
      type: object
      description: An extrinsic in a block.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Database id of the extrinsic record.
          example: 1
        blockHash:
          $ref: '#/components/schemas/Hash256Hex'
        blockNumber:
          type: integer
          format: int64
          description: Extrinsic block height.
          minimum: 0
          example: 29781585
        blockTimestamp:
          type: integer
          format: int64
          description: Extrinsic block timestamp - milliseconds.
          minimum: 0
          example: 1755935208000
        specVersion:
          type: integer
          minimum: 0
          description: Extrinsic runtime spec version.
          example: 1001
        blockStatus:
          $ref: '#/components/schemas/BlockStatus'
        traceIndex:
          type: integer
          minimum: 0
          description: Extrinsic data trace index.
          example: 40
        hash:
          $ref: '#/components/schemas/Hash256Hex'
        index:
          type: integer
          minimum: 0
          description: Extrinsic index in block.
        version:
          type: integer
          minimum: 0
          description: Extrinsic version.
        signer:
          $ref: '#/components/schemas/MultiAddress'
          description: Substrate multiaddress representation.
        signature:
          $ref: '#/components/schemas/SignatureHex'
        extra:
          type: object
          additionalProperties: true
          description: Extrinsic extras - checkNonce, checkGenesis, chargeTransactionPayment, etc.
        isSuccessful:
          type: boolean
          description: Whether the extrinsic execution was successful.
      required:
        - id
        - blockHash
        - blockNumber
        - blockTimestamp
        - specVersion
        - blockStatus
        - traceIndex
        - hash
        - index
        - version
        - isSuccessful
      example:
        id: 392
        blockHash: '0x77d09455b5a5014cf8df62080f8a36aebd89f6dcec831c5acfb4444d07184b51'
        blockNumber: 25000005
        blockTimestamp: 1726829136000
        specVersion: 1003000
        blockStatus: finalized
        traceIndex: 324
