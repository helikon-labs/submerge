        '200':
          $ref: '#/components/schemas/Extrinsic'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /extrinsics/{extrinsic_ref}/calls:
    get:
      summary: Get extrinsic calls
      description: Returns the calls for extrinsic by reference.
      operationId: getExtrinsicCalls
      tags:
