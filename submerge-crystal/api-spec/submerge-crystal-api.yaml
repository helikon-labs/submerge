openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Submerge Crystal API v1
  description: |
    REST API for Submerge Crystal, the indexer component of Submerge.
    Submerge API comes with a set of five resources:
    - Blocks
    - Extrinsics
    - Calls
    - Events
    - Traces
  version: 1.0.0
  contact:
    name: Helikon Labs
    url: https://helikon.io
    email: info@helikon.io
  license:
    name: GPLv3
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: https://{chain}.api.crystal.submerge.io/v1
    description: Submerge Crystal API Server
    variables:
      chain:
        default: polkadot
        enum:
          - polkadot
          - asset-hub-polkadot
          - bridge-hub-polkadot
          - collectives-polkadot
          - coretime-polkadot
          - people-polkadot
          - kusama
          - asset-hub-kusama
          - bridge-hub-kusama
          - coretime-kusama
          - people-kusama

tags:
  - name: block
    description: Operations and items related to blocks.
  - name: trace
    description: Operations and items related to block traces.
  - name: call
    description: Operations and items related to calls in extrinsics.
  - name: extrinsic
    description: Operations and items related to extrinsics.
  - name: event
    description: Operations and items related to events.
  - name: genesis
    description: Operations and items related to genesis records.
  - name: metadata
    description: Operations and items related to metadata.

components:
  parameters:
    PageNumber:
      name: page_number
      in: query
      description: Page number to retrieve.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: page_size
      in: query
      description: Number of items per page to be returned.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    BlockRef:
      name: block_ref
      in: path
      required: true
      description: >
        Block reference. Either:
        - a block number (integer ≥ 0), or
        - a block hash in hex (with or without `0x` prefix, case-insensitive).
      schema:
        type: string
        pattern: '^(?:\d+|(0x)?[a-f0-9A-F]{64})$'
    BlockStatus:
      name: status
      in: query
      required: false
      description: Filter results by block status.
      schema:
        $ref: '#/components/schemas/BlockStatus'
    MinBlockNumber:
      name: min_block_number
      in: query
      description: Filter results by minimum block number.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
      example: 0
    MaxBlockNumber:
      name: max_block_number
      in: query
      description: Filter results by maximum block number.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
      example: 0
    MinBlockTimestamp:
      name: min_block_timestamp
      in: query
      required: false
      description: Filter results by minimum block timestamp.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
        example: 1755773684012
    MaxBlockTimestamp:
      name: max_block_timestamp
      in: query
      required: false
      description: Filter results by maximum block timestamp.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
        example: 1755773684012
    MinSpecVersion:
      name: min_spec_version
      in: query
      description: Filter results by minimum runtime spec version.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    MaxSpecVersion:
      name: max_spec_version
      in: query
      description: Filter results by maximum runtime spec version.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    AuthorRef:
      name: author
      in: query
      description: Filter results by block author.
      required: false
      schema:
        oneOf:
          - type: string
            pattern: ^[1-9A-HJ-NP-Za-km-z]{47,48}$
            description: Author's Substrate SS58 address string.
            example: 5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY
          - type: string
            pattern: ^(?:0x)?[a-f0-9]{64}$
            description: Author's 32-byte Substrate account id encoded in hex with optional `0x` prefix.
            examples:
              - 0x008d8404893c7b4b80f397605cc96e61fec3c89676c8c2794a2a7d281d678b1a
              - 008d8404893c7b4b80f397605cc96e61fec3c89676c8c2794a2a7d281d678b1a
    SignerRef:
      name: signer
      in: query
      description: Filter results by a signer.
      required: false
      schema:
        oneOf:
          - type: string
            pattern: ^[1-9A-HJ-NP-Za-km-z]{47,48}$
            description: Signer's Substrate SS58 address string.
            example: 5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY
          - type: string
            pattern: ^(?:0x)?[a-f0-9]{64}$
            description: Signer's 32-byte Substrate account id encoded in hex with optional `0x` prefix.
            examples:
              - '0x008d8404893c7b4b80f397605cc96e61fec3c89676c8c2794a2a7d281d678b1a'
              - '008d8404893c7b4b80f397605cc96e61fec3c89676c8c2794a2a7d281d678b1a'
    PalletName:
      name: pallet_name
      in: query
      description: Filter results by pallet name. Can be full or partial name. Case insensitive.
      required: false
      schema:
        type: string
    PalletCallName:
      name: pallet_call_name
      in: query
      description: Filter results by pallet call name. Can be full or partial name. Case insensitive.
      required: false
      schema:
        type: string
    PalletEventName:
      name: pallet_event_name
      in: query
      description: Filter results by pallet event name. Can be full or partial name. Case insensitive.
      required: false
      schema:
        type: string
    ItemIndex:
      name: index
      in: path
      description: Index of an item.
      required: true
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    ItemId:
      name: id
      in: path
      description: Database id of an item.
      required: true
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    ExtrinsicRef:
      name: extrinsic_ref
      in: path
      description: Extrinsic reference (hash or database id).
      required: true
      schema:
        oneOf:
          - type: string
            pattern: '^0x[a-f0-9]{64}$'
            description: Extrinsic hash.
            example: '0x91b171bb158e2d3848fa23a9f1c25182fb8e20313b2c1eb49219da7a70ce90c3'
          - type: integer
            format: int64
            minimum: 0
            default: 0
            description: Extrinsic database id.
            example: 748
    SpecVersion:
      name: spec_version
      in: path
      description: Spec version path parameter.
      required: true
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
  schemas:
    Error:
      type: object
      description: Generic error type.
      properties:
        code:
          type: integer
          minimum: 0
          description: Error code.
          example: 0
        message:
          type: string
          description: Error message.
          example: Internal server error.
        details:
          type: object
          additionalProperties: true
          description: Error details.
          example:
            field: Random value.
      required:
        - code
        - message
      example:
        code: 0
        message: Internal server error.
    PaginationData:
      type: object
      description: Pagination data for paged responses.
      properties:
        pageNumber:
          type: integer
          description: Current page number.
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
          example: 1
        totalCount:
          type: integer
          description: Total number of items across all pages.
          minimum: 0
          example: 78
        hasNext:
          type: boolean
          description: Whether there is a next page.
          example: true
        hasPrevious:
          type: boolean
          description: Whether there is a previous page.
          example: false
      required:
        - pageNumber
        - pageSize
        - totalCount
        - hasNext
        - hasPrevious
      example:
        pageNumber: 1
        pageSize: 20
        totalCount: 78
        hasNext: true
        hasPrevious: false
    HexString:
      type: string
      description: >
        Arbitrary hex-encoded string. Accepts any length, with `0x` prefix.
      pattern: '^0x[0-9a-fA-F]+$'
      examples:
        - "0xdeadbeef"
        - "0x0123456789abcdef"
    AccountIdHex:
      type: string
      pattern: '^0x[a-f0-9]{64}$'
      description: '32-byte Substrate account id encoded in hex.'
      example: '0x008d8404893c7b4b80f397605cc96e61fec3c89676c8c2794a2a7d281d678b1a'
    Hash256Hex:
      type: string
      pattern: '^0x[a-f0-9]{64}$'
      description: '32-byte Blake2b-256 hash, lowercase hex-encoded with `0x` prefix.'
      example: '0x91b171bb158e2d3848fa23a9f1c25182fb8e20313b2c1eb49219da7a70ce90c3'
    SignatureHex:
      type: string
      description: >
        Hex-encoded Substrate extrinsic signature. Supports Sr25519/Ed25519 (64 bytes → 128 hex chars)
        and ECDSA (65 bytes → 130 hex chars). `0x`-prefixed.
      pattern: '^0x([0-9a-fA-F]{128}|[0-9a-fA-F]{130})$'
      examples:
        - "0xabababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababab"
        - "0xababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababab"
    BlockStatus:
      type: string
      enum: [proposed, finalized, pruned]
      description: >
        Block status.
        - `finalized`: Blocks that have been finalized on chain.
        - `proposed`: Blocks that have been authored but not yet finalized.
        - `pruned`: Blocks that have been removed or are no longer accessible.
    TraceMethod:
      type: string
      enum: [Put, ChildPut, ChildKill, ClearPrefix, ChildClearPrefix, Append, Genesis]
      description: Trace method.
    Block:
      type: object
      description: A block in the blockchain
      tags:
        - block
      properties:
        hash:
          $ref: '#/components/schemas/Hash256Hex'
        parentHash:
          $ref: '#/components/schemas/Hash256Hex'
        stateRoot:
          $ref: '#/components/schemas/Hash256Hex'
        extrinsicRoot:
          $ref: '#/components/schemas/Hash256Hex'
        number:
          type: integer
          format: int64
          description: Block height.
          minimum: 0
          example: 20324123
        timestamp:
          type: integer
          format: int64
          description: Block timestamp - milliseconds.
          minimum: 0
          example: 1755773684012
        specVersion:
          type: integer
          minimum: 0
          description: Runtime spec version.
          example: 1001
        status:
          $ref: '#/components/schemas/BlockStatus'
        weight:
          type: object
          additionalProperties: true
          description: Block weight - varying schema depending on runtime metadata.
        extrinsicCount:
          type: integer
          minimum: 0
          description: Number of extrinsics in the block.
          example: 3
        eventCount:
          type: integer
          minimum: 0
          description: Number of events in the block.
          example: 12
        authorAccountId:
          $ref: '#/components/schemas/AccountIdHex'
          description: Authoring validator account id.
      required:
        - hash
        - parentHash
        - stateRoot
        - extrinsicRoot
        - number
        - timestamp
        - specVersion
        - status
        - weight
        - extrinsicCount
        - eventCount
        - authorAccountId
      example:
        hash: '0xc82fe0d5752d42ae3d325f14206859f86cec7447f244d5b4bccfc2a00bd58df8'
        parentHash: '0x1615581259dd1ac45fea1b23406367ca79c9f6dfa3b3b1115517c6e86250c42b'
        stateRoot: '0x8c8b0b599733c41bad79a617d8f2f0213a5d965d287cee16c9efd65f23001603'
        extrinsicRoot: '0x7893dd573a5033a6d785bf4038c237cbd8e1f3730d177d4f9b21c8d2c7b34454'
        number: 27419831
        timestamp: 1755773684012
        specVersion: 1006001
        status: 'finalized'
        weight:
          normal:
            refTime: '0'
            proofSize: '0'
          mandatory:
            refTime: '701777135384'
            "proofSize": '204955'
          operational:
            refTime: '0'
            proofSize: '0'
        extrinsicCount: 2
        eventCount: 56
        authorAccountId: '0x269a84431cd8dfc5762beadfa54a8f21597c12d4f31e51f9f6f985f65ba0c626'
    Trace:
      type: object
      description: A trace record in a block
      tags:
        - trace
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          description: Id of the trace record.
          example: 1
        blockHash:
          $ref: '#/components/schemas/Hash256Hex'
        blockParentHash:
          $ref: '#/components/schemas/Hash256Hex'
        blockNumber:
          type: integer
          format: int64
          description: Trace block height.
          minimum: 0
          example: 20324123
        specVersion:
          type: integer
          minimum: 0
          description: Trace runtime spec version.
          example: 1001
        blockStatus:
          $ref: '#/components/schemas/BlockStatus'
        index:
          type: integer
          description: Index of the trace record in the block.
          minimum: 0
          example: 23
        key:
          type: string
          description: Storage key.
          example: '26aa394eea5630e07c48ae0c9558cef7ff553b5a9862a516939d82b3d3d8661a'
        value:
          type: string
          description: Storage value.
          examples:
            - 'None'
            - 'Some(02)'
            - 'Some(9e44c0f852654f5750818ec680e04124e37b711deaa44e739e1d994729508168)'
        extId:
          type: string
          description: External id in hex.
          examples: 
            - 'cafe'
            - 'ee54'
        method:
          $ref: '#/components/schemas/TraceMethod'
        parentId:
          type: string
          description: Parent storage id.
      required:
        - id
        - blockHash
        - blockParentHash
        - blockNumber
        - specVersion
        - blockStatus
        - index
        - key
        - value
        - extId
        - method
      example:
        id: 2567824
        blockHash: '0xc82fe0d5752d42ae3d325f14206859f86cec7447f244d5b4bccfc2a00bd58df8'
        blockParentHash: '0x1615581259dd1ac45fea1b23406367ca79c9f6dfa3b3b1115517c6e86250c42b'
        blockNumber: 27419831
        specVersion: 1006001
        blockStatus: 'finalized'
        index: 0
        key: '0xab43526'
        value: '0x1435adde34ff94782'
        extId: ''
        method: 'Put'
    Call:
      type: object
      description: A call in an extrinsic.
      tags:
        - call
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          description: Database id of the call record.
          example: 1
        blockHash:
          $ref: '#/components/schemas/Hash256Hex'
        blockNumber:
          type: integer
          format: int64
          description: Call block height.
          minimum: 0
          example: 20324123
        blockTimestamp:
          type: integer
          format: int64
          description: Call block timestamp - milliseconds.
          minimum: 0
          example: 1755773684012
        specVersion:
          type: integer
          minimum: 0
          description: Call runtime spec version.
          example: 1001
        blockStatus:
          $ref: '#/components/schemas/BlockStatus'
        extrinsicId:
          type: integer
          format: int64
          minimum: 1
          description: Call extrinsic database id.
          example: 1
        extrinsicIndex:
          type: integer
          minimum: 0
          description: Call extrinsic index.
          example: 0
        extrinsicHash:
          $ref: '#/components/schemas/Hash256Hex'
        parentCallId:
          oneOf: [{ type: integer, minimum: 0, example: 175 }, { type: 'null' }]
          description: If a nested call, the call's parent call record id.
        nestingIndex:
          type: string
          description: Submerge-specific nesting identifier for nested calls.
          example: 'calls::0'
        palletIndex:
          type: integer
          minimum: 0
          description: Call's pallet index in the metadata.
          example: 0
        palletName:
          type: string
          description: Call's pallet name in the metadata - capital case.
          example: Balances
        palletCallIndex:
          type: integer
          minimum: 0
          description: Call's index in the pallet in the metadata.
          example: 0
        palletCallName:
          type: string
          description: Call's name name in the pallet in the metadata - capital case.
          example: ForceTransfer
        isSuccessful:
          type: boolean
          description: Whether the call's extrinsic was successful.
        args:
          type: object
          additionalProperties: true
          description: Call arguments.
      required:
        - id
        - blockHash
        - blockNumber
        - blockTimestamp
        - specVersion
        - blockStatus
        - extrinsicId
        - extrinsicIndex
        - extrinsicHash
        - palletIndex
        - palletName
        - palletCallIndex
        - palletCallName
        - isSuccessful
        - args
      example:
        id: 1
        blockHash: '0x77d09455b5a5014cf8df62080f8a36aebd89f6dcec831c5acfb4444d07184b51'
        blockNumber: 29781585
        blockTimestamp: 1755935208000
        specVersion: 1006001
        blockStatus: finalized
        extrinsicId: 1
        extrinsicIndex: 0
        extrinsicHash: '0x5cffd6624df1b3447bc5aa9db09a414f7b5058ff1b7bc3c53ae564248924fa0a'
        palletIndex: 2
        palletName: 'Timestamp'
        palletCallIndex: 0
        palletCallName: 'Set'
        isSuccessful: true
        args:
          now: '1755935208000'
    Event:
      type: object
      description: An event in a block.
      tags:
        - event
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          description: Id of the event record.
          example: 1
        blockHash:
          $ref: '#/components/schemas/Hash256Hex'
        blockNumber:
          type: integer
          format: int64
          description: Event block height.
          minimum: 0
          example: 29781585
        blockTimestamp:
          type: integer
          format: int64
          description: Event block timestamp - milliseconds.
          minimum: 0
          example: 1755935208000
        specVersion:
          type: integer
          minimum: 0
          description: Event runtime spec version.
          example: 1001
        blockStatus:
          $ref: '#/components/schemas/BlockStatus'
        traceIndex:
          type: integer
          minimum: 0
          description: Event trace index.
          example: 40
        palletIndex:
          type: integer
          minimum: 0
          description: Event's pallet index in the metadata.
          example: 0
        palletName:
          type: string
          description: Event's pallet name in the metadata - capital case.
          example: Balances
        palletEventIndex:
          type: integer
          minimum: 0
          description: Event's index in the pallet in the metadata.
          example: 0
        palletEventName:
          type: string
          description: Event's name name in the pallet in the metadata - capital case.
          example: ForceTransfer
        extrinsicIndex:
          type: integer
          minimum: 0
          description: Event extrinsic index.
          example: 0
        extrinsicHash:
          $ref: '#/components/schemas/Hash256Hex'
        phase:
          type: string
          description: Event phase.
          example: ApplyExtrinsic
        index:
          type: integer
          minimum: 0
          description: Event index in block.
          example: 0
        args:
          type: object
          additionalProperties: true
          description: Event arguments.
      required:
        - id
        - blockHash
        - blockNumber
        - blockTimestamp
        - specVersion
        - blockStatus
        - traceIndex
        - palletIndex
        - palletName
        - palletEventIndex
        - palletEventName
        - extrinsicIndex
        - extrinsicHash
        - phase
        - index
        - args
      example:
        id: 392
        blockHash: '0x77d09455b5a5014cf8df62080f8a36aebd89f6dcec831c5acfb4444d07184b51'
        blockNumber: 25000005
        blockTimestamp: 1726829136000
        specVersion: 1003000
        blockStatus: finalized
        traceIndex: 324
        palletIndex: 53
        palletName: 'ParaInclusion'
        palletEventIndex: 3
        palletEventName: 'UpwardMessagesReceived'
        extrinsicIndex: 1
        extrinsicHash: '0x5cffd6624df1b3447bc5aa9db09a414f7b5058ff1b7bc3c53ae564248924fa0a'
        phase: ApplyExtrinsic
        index: 24
        args:
          from: '1005'
          count: '1'
    Extrinsic:
      type: object
      description: An extrinsic in a block.
      tags:
        - extrinsic
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          description: Database id of the extrinsic record.
          example: 1
        blockHash:
          $ref: '#/components/schemas/Hash256Hex'
        blockNumber:
          type: integer
          format: int64
          description: Extrinsic block height.
          minimum: 0
          example: 29781585
        blockTimestamp:
          type: integer
          format: int64
          description: Extrinsic block timestamp - milliseconds.
          minimum: 0
          example: 1755935208000
        specVersion:
          type: integer
          minimum: 0
          description: Extrinsic runtime spec version.
          example: 1001
        blockStatus:
          $ref: '#/components/schemas/BlockStatus'
        traceIndex:
          type: integer
          minimum: 0
          description: Extrinsic data trace index.
          example: 40
        hash:
          $ref: '#/components/schemas/Hash256Hex'
        index:
          type: integer
          minimum: 0
          description: Extrinsic index in block.
        version:
          type: integer
          minimum: 0
          description: Extrinsic version.
        signer:
          $ref: '#/components/schemas/HexString'
          description: SCALE-encoded multiaddress in hex format.
        signature:
          $ref: '#/components/schemas/SignatureHex'
        extra:
          type: object
          additionalProperties: true
          description: Extrinsic extras - checkNonce, checkGenesis, chargeTransactionPayment, etc.
        isSuccessful:
          type: boolean
          description: Whether the extrinsic execution was successful.
      required:
        - id
        - blockHash
        - blockNumber
        - blockTimestamp
        - specVersion
        - blockStatus
        - traceIndex
        - hash
        - index
        - version
        - isSuccessful
      example:
        id: 392
        blockHash: '0x77d09455b5a5014cf8df62080f8a36aebd89f6dcec831c5acfb4444d07184b51'
        blockNumber: 25000005
        blockTimestamp: 1726829136000
        specVersion: 1003000
        blockStatus: finalized
        traceIndex: 324
        hash: '0x35efc78bd55f0a7425d6f3adb2c7990f5c6ea42c186a9ec3103045a152f12f48'
        index: 1
        version: 3
        signer: '0x006691ffb1fea3613197fdf95dc2d850f7ce48d2bb458810e81b47aed4997ea262'
        signature: '0x01ae6408aef67c5e6d1a5b6f8bc8bb43af4a2f322f53430a9c89e7ffbd16b1006dc62b91ed38ca87ed826431eb6858da720a89dd8841dd2fed7f80d45a48ad098f'
        extra:
          checkNonce: '295'
          checkMortality:
            type: 'Mortal229'
            value: '3'
          checkMetadataHash:
            mode:
              type: 'Disabled'
          chargeTransactionPayment: '0'
        isSuccessful: true
    GenesisRecord:
      type: object
      description: A storage item initialized at genesis.
      tags:
        - genesis
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Database id.
          example: 1
        key:
          $ref: '#/components/schemas/HexString'
        value:
          $ref: '#/components/schemas/HexString'
      required: [id, key, value]
    MetadataSummary:
