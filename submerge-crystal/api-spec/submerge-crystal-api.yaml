          type: accountId
          value: '0x006691ffb1fea3613197fdf95dc2d850f7ce48d2bb458810e81b47aed4997ea2'
        signature: '0x01ae6408aef67c5e6d1a5b6f8bc8bb43af4a2f322f53430a9c89e7ffbd16b1006dc62b91ed38ca87ed826431eb6858da720a89dd8841dd2fed7f80d45a48ad098f'
        extra:
          checkNonce: '295'
          checkMortality:
            type: 'Mortal229'
            value: '3'
          checkMetadataHash:
            mode:
              type: 'Disabled'
          chargeTransactionPayment: '0'
        isSuccessful: true
    GenesisRecord:
      type: object
      description: A storage item initialized at genesis.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Database id.
          example: 1
        key:
          $ref: '#/components/schemas/HexString'
        value:
          $ref: '#/components/schemas/HexString'
      required: [id, key, value]
    MetadataItemDocs:
      type: array
      description: Documentation for a metadata item.
      items:
        type: string
    Metadata:
      type: object
      description: Basic fields to define a runtime version metadata.
      properties:
        specVersion:
          type: integer
          minimum: 0
          description: Metadata runtime spec version.
          example: 1001
        metadataVersion:
          type: integer
          minimum: 1
          description: Metadata version.
          example: 14
    MetadataPallet:
      type: object
      description: A pallet in a metadata.
      properties:
        index:
          type: integer
          minimum: 0
          description: Pallet's index inside the metadata.
          example: 0
        name:
          type: string
    MetadataPalletCall:
      type: object
      description: A call in a metadata pallet.
      properties:
        index:
          type: integer
          minimum: 0
          description: Call's index inside the metadata pallet.
          example: 0
        name:
          type: string
          description: Call name.
        docs:
          $ref: '#/components/schemas/MetadataItemDocs'
    MetadataPalletConstant:
      type: object
      description: A constant in a metadata pallet.
      properties:
        index:
          type: integer
          minimum: 0
          description: Constant's index inside the metadata pallet.
          example: 0
        name:
          type: string
          description: Constant name.
          example: BlockLength
        typeId:
          type: integer
          description: Constant type id.
          minimum: 0
        typeName:
          type: string
          description: Constant type name - usually a Rust-style type path.
        valueHex:
          $ref: '#/components/schemas/HexStringLoose'
        value:
          type: object
          description: Constant value in JSON format.
          additionalProperties: true
        docs:
          $ref: '#/components/schemas/MetadataItemDocs'
    MetadataPalletError:
      type: object
      description: An error defined in a metadata pallet.
      properties:
        index:
          type: integer
          minimum: 0
          description: Error's index inside the metadata pallet.
          example: 0
        name:
          type: string
          description: Error name.
        docs:
          $ref: '#/components/schemas/MetadataItemDocs'
    MetadataPalletEvent:
      type: object
      description: An event defined in a metadata pallet.
      properties:
        index:
          type: integer
          minimum: 0
          description: Event's index inside the metadata pallet.
          example: 0
        name:
          type: string
          description: Event name.
        docs:
          $ref: '#/components/schemas/MetadataItemDocs'
    MetadataPalletStorageItem:
      type: object
      description: A storage item defined in a metadata pallet.
      properties:
        index:
          type: integer
          minimum: 0
          description: Storage item's index inside the metadata pallet.
          example: 0
        name:
          type: string
          description: Storage item name.
        key:
          description: Storage item key.
          $ref: '#/components/schemas/HexString'
        docs:
          $ref: '#/components/schemas/MetadataItemDocs'
  parameters:
    Page:
      name: page
      in: query
      description: Page number to retrieve. 1-indexed.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: page_size
      in: query
      description: Number of items per page to be returned.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    BlockRef:
      name: block_ref
      in: path
      required: true
      description: >
        Block reference. Either:
        - a block number (integer ≥ 0), or
        - a block hash in hex (with or without `0x` prefix, case-insensitive).
      schema:
        type: string
        pattern: '^(?:\d+|(0x)?[a-f0-9A-F]{64})$'
    BlockStatus:
      name: status
      in: query
      required: false
      description: Filter results by block status. If not specified, all blocks are returned.
      schema:
        $ref: '#/components/schemas/BlockStatus'
    MinBlockNumber:
      name: min_block_number
      in: query
      description: Filter results by minimum block number.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 0
    MaxBlockNumber:
      name: max_block_number
      in: query
      description: Filter results by maximum block number.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 0
    MinBlockTimestamp:
      name: min_block_timestamp
      in: query
      required: false
      description: Filter results by minimum block timestamp.
      schema:
        type: integer
        format: int64
        minimum: 0
        example: 1755773684012
    MaxBlockTimestamp:
      name: max_block_timestamp
      in: query
      required: false
      description: Filter results by maximum block timestamp.
      schema:
        type: integer
        format: int64
        minimum: 0
        example: 1755773684012
    MinSpecVersion:
      name: min_spec_version
      in: query
      description: Filter results by minimum runtime spec version.
      required: false
      schema:
        type: integer
        minimum: 0
      example: 0
    MaxSpecVersion:
      name: max_spec_version
      in: query
      description: Filter results by maximum runtime spec version.
      required: false
      schema:
        type: integer
        minimum: 0
      example: 0
    AuthorRef:
      name: author
      in: query
      description: Filter results by block author.
      required: false
      schema:
        oneOf:
          - type: string
            pattern: '^[1-9A-HJ-NP-Za-km-z]{47,48}$'
            description: Author's Substrate SS58 address string.
            example: 5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY
          - type: string
            pattern: '^(?:0x)?[0-9a-fA-F]{64}$'
            description: Author's 32-byte Substrate account id encoded in hex with optional `0x` prefix.
            examples:
              - '0x008d8404893c7b4b80f397605cc96e61fec3c89676c8c2794a2a7d281d678b1a'
              - '008d8404893c7b4b80f397605cc96e61fec3c89676c8c2794a2a7d281d678b1a'
    SignerRef:
      name: signer
      in: query
      description: Filter results by a signer.
      required: false
      schema:
        oneOf:
          - type: string
            pattern: '^[1-9A-HJ-NP-Za-km-z]{47,48}$'
            description: Signer's Substrate SS58 address string.
            example: 5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY
          - type: string
            pattern: '^(?:0x)?[0-9a-fA-F]{64}$'
            description: Signer's 32-byte Substrate account id encoded in hex with optional `0x` prefix.
            examples:
              - '0x008d8404893c7b4b80f397605cc96e61fec3c89676c8c2794a2a7d281d678b1a'
              - '008d8404893c7b4b80f397605cc96e61fec3c89676c8c2794a2a7d281d678b1a'
    PalletName:
      name: pallet_name
      in: query
      description: Filter results by pallet name. Can be full or partial name. Case insensitive.
      required: false
      schema:
        type: string
    PalletCallName:
      name: pallet_call_name
      in: query
      description: Filter results by pallet call name. Can be full or partial name. Case insensitive.
      required: false
      schema:
        type: string
    PalletEventName:
      name: pallet_event_name
      in: query
      description: Filter results by pallet event name. Can be full or partial name. Case insensitive.
      required: false
      schema:
        type: string
    ItemIndex:
      name: index
      in: path
      description: Index of an item.
      required: true
      schema:
        type: integer
        minimum: 0
      example: 0
    ExtrinsicHash:
      name: extrinsic_hash
      in: path
      description: Extrinsic hash.
      required: true
      schema:
        type: string
        pattern: '^(?:0x)?[0-9a-fA-F]{64}$'
        example: '0x91b171bb158e2d3848fa23a9f1c25182fb8e20313b2c1eb49219da7a70ce90c3'
    SpecVersion:
      name: spec_version
      in: path
      description: Spec version path parameter.
      required: true
      schema:
        type: integer
        minimum: 0
      example: 0
  responses:
