openapi: 3.1.0
info:
  title: Submerge Crystal API v1
  description: |
    REST API for Submerge Crystal, the indexer component of Submerge.
    Submerge API comes with a set of five resources:
    - Blocks
    - Extrinsics
    - Calls
    - Events
    - Traces
  version: 1.0.0
  contact:
    name: Helikon Labs
    url: https://helikon.io
    email: info@helikon.io
  license:
    name: GPLv3
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: https://api.crystal.submerge.io/v1
    description: Submerge Crystal API Server

components:
  parameters:
    Chain:
      name: chain
      in: path
      required: true
      description: Chain slug parameter.
      style: simple
      schema:
        $ref: '#/components/schemas/ChainSlug'
    PageNumber:
      name: pageNumber
      in: query
      description: Page number to retrieve.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: pageSize
      in: query
      description: Number of items per page to be returned.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 25
      example: 25
  schemas:
    ChainSlug:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      description: Chain slug. Lowercase, hyphenated (e.g., `polkadot`, `asset-hub-polkadot`).
      examples:
        - polkadot
        - kusama
        - asset-hub-polkadot
    PaginationData:
      type: object
      description: Pagination data for paged responses.
      properties:
        pageNumber:
          type: integer
          description: Current page number.
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
          example: 1
        totalCount:
          type: integer
          description: Total number of items across all pages.
          minimum: 0
          example: 78
        hasNext:
          type: boolean
          description: Whether there is a next page.
          example: true
        hasPrevious:
          type: boolean
          description: Whether there is a previous page.
          example: false
      required:
        - pageNumber
        - pageSize
        - totalCount
        - hasNext
        - hasPrevious
      example:
        pageNumber: 1
        pageSize: 20
        totalCount: 78
        hasNext: true
        hasPrevious: false
    Block:
      type: object
      description: A block in the blockchain
      tags:
        - block
      properties:
        number:
          type: integer
          description: Block height
          example: 20324123
        hash:
          type: string
          description: Hash of the block in hexadecimal format
          example: '0x109f468f38b89f7b64035783ff166cfba47c8c1b8b8cdde77b46dc391ceee4fc'
      required:
        - number
        - hash
      example:
        number: 20324123
        hash: '0x109f468f38b89f7b64035783ff166cfba47c8c1b8b8cdde77b46dc391ceee4fc'
    PaginatedBlockList:
      type: object
      description: List of blocks with pagination info.
      tags:
        - block
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Block'
          description: Array of blocks for the current page.
        pagination:
          $ref: '#/components/schemas/PaginationData'
      required:
        - data
        - pagination
      example:
        data:
          - number: 20324123
            hash: '0x109f468f38b89f7b64035783ff166cfba47c8c1b8b8cdde77b46dc391ceee4fc'
          - number: 20324124
            hash: '0x209f468f38b89f7b64035783ff166cfba47c8c1b8b8cdde77b46dc391ceee4fd'
        pagination:
          pageNumber: 1
          pageSize: 20
          totalCount: 78
          hasNext: true
          hasPrevious: false

tags:
  - name: block
    description: Operations related to blocks.
  - name: trace
    description: Operations related to block traces.
  - name: call
    description: Operations related to calls in extrinsics.
  - name: extrinsic
    description: Operations related to extrinsics in blocks.
  - name: event
    description: Operations related to block events in blocks.

paths:
  /{chain}/blocks:
    get:
      summary: Get all blocks
      description: Returns all blocks from the database. It will return a paginated response, ordered ascending by block number.
      operationId: getAllBlocks
      tags:
        - block
      parameters:
        - $ref: '#/components/parameters/Chain'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: number
          in: query
          description: Filter blocks by number
          required: false
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: A paginated list of blocks.
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: "#/components/schemas/PaginatedBlockList"
              example:
                data:
                  - number: 20324125
                    hash: '0x109f468f38b89f7b64035783ff166cfba47c8c1b8b8cdde77b46dc391ceee4fc'
                  - number: 20324124
                    hash: '0x209f468f38b89f7b64035783ff166cfba47c8c1b8b8cdde77b46dc391ceee4fd'
                  - number: 20324123
                    hash: '0x309f468f38b89f7b64035783ff166cfba47c8c1b8b8cdde77b46dc391ceee4fe'
                pagination:
                  pageNumber: 1
                  pageSize: 25
                  totalCount: 78
                  hasNext: true
                  hasPrevious: false
        '500':
          description: Internal server error