paths:
  /blocks:
    get:
      summary: Get blocks
      description: >
        Returns all blocks from the database that satisfy the query parameters.
        It will return a paginated response, ordered descending by block number.
      operationId: getBlocks
      tags:
        - block
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/BlockStatus'
        - $ref: '#/components/parameters/MinBlockNumber'
        - $ref: '#/components/parameters/MaxBlockNumber'
        - $ref: '#/components/parameters/MinBlockTimestamp'
        - $ref: '#/components/parameters/MaxBlockTimestamp'
        - $ref: '#/components/parameters/MinSpecVersion'
        - $ref: '#/components/parameters/MaxSpecVersion'
        - $ref: '#/components/parameters/AuthorRef'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedBlockList'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /blocks/{block_ref}:
    get:
      summary: Get block by reference
      description: >
        If a hash is passed, returns the matching block.
        If a number is passed, gives the blocks by that number - could be multiple blocks if there's a pruned block in that slot.
      operationId: getBlock
      tags:
        - block
      parameters:
        - $ref: '#/components/parameters/BlockRef'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedBlockList'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /blocks/{block_ref}/traces:
    get:
      summary: Get traces in a block
      description: >
        If a hash is passed, returns the traces for the matching block.
        If a number is passed, gives the traces for the latest block by that number - could be multiple blocks if there's a pruned block in that slot.
      operationId: getBlockTraces
      tags:
        - trace
      parameters:
        - $ref: '#/components/parameters/BlockRef'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedTraceList'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /blocks/{block_ref}/calls:
    get:
      summary: Get calls in a block
      description: >
        If a hash is passed, returns the calls for the matching block.
        If a number is passed, gives the calls for the latest block by that number - could be multiple blocks if there's a pruned block in that slot.
      operationId: getBlockCalls
      tags:
        - call
      parameters:
        - $ref: '#/components/parameters/BlockRef'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PalletName'
        - $ref: '#/components/parameters/PalletCallName'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedCallList'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /blocks/{block_ref}/events:
    get:
      summary: Get events in a block
      description: >
        If a hash is passed, returns the events for the matching block.
        If a number is passed, gives the events for the latest block by that number - could be multiple blocks if there's a pruned block in that slot.
      operationId: getBlockEvents
      tags:
        - event
      parameters:
        - $ref: '#/components/parameters/BlockRef'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PalletName'
        - $ref: '#/components/parameters/PalletEventName'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedEventList'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /blocks/{block_ref}/events/{index}:
    get:
      summary: Get block event by index
      description: Returns an event in a block by its index.
      operationId: getBlockEvent
      tags:
        - event
      parameters:
        - $ref: '#/components/parameters/BlockRef'
        - $ref: '#/components/parameters/ItemIndex'
      responses:
        '200':
          $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /blocks/{block_ref}/extrinsics:
    get:
      summary: Get extrinsics in a block
      description: >
        If a hash is passed, returns the extrinsics for the matching block.
        If a number is passed, gives the extrinsics for the latest block by that number - could be multiple blocks if there's a pruned block in that slot.
      operationId: getBlockExtrinsics
      tags:
        - extrinsic
      parameters:
        - $ref: '#/components/parameters/BlockRef'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SignerRef'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedExtrinsicList'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /blocks/{block_ref}/extrinsics/{index}:
    get:
      summary: Get block extrinsic by index
      description: Returns an extrinsic in a block by its index.
      operationId: getBlockExtrinsic
      tags:
        - extrinsic
      parameters:
        - $ref: '#/components/parameters/BlockRef'
        - $ref: '#/components/parameters/ItemIndex'
      responses:
        '200':
          $ref: '#/components/schemas/Extrinsic'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /blocks/{block_ref}/extrinsics/{index}/calls:
    get:
      summary: Get block extrinsic calls
      description: Returns the calls for extrinsic in a block by its index.
      operationId: getBlockExtrinsicCalls
      tags:
        - call
      parameters:
        - $ref: '#/components/parameters/BlockRef'
        - $ref: '#/components/parameters/ItemIndex'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedCallList'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /blocks/{block_ref}/extrinsics/{index}/events:
    get:
      summary: Get block extrinsic events
      description: Returns the events for extrinsic in a block by its index.
      operationId: getBlockExtrinsicEvents
      tags:
        - event
      parameters:
        - $ref: '#/components/parameters/BlockRef'
        - $ref: '#/components/parameters/ItemIndex'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedEventList'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /traces:
    get:
      summary: Get traces
      description: >
        Returns all traces from the database that satisfy the query parameters.
        It will return a paginated response, ordered descending by trace id.
      operationId: getTraces
      tags:
        - trace
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: key
          description: Trace key.
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/HexString'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedTraceList'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /traces/{id}:
    get:
      summary: Get trace by id
      description: Returns a trace by its database id.
      operationId: getTraceById
      tags:
        - trace
      parameters:
