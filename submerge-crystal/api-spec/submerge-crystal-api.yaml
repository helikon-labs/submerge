      responses:
        '200':
          $ref: '#/components/schemas/Trace'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /calls:
    get:
      summary: Get calls
      description: >
        Returns all calls from the database that satisfy the query parameters.
        It will return a paginated response, ordered descending by block number, then call id.
      operationId: getCalls
      tags:
        - call
      parameters:
        - $ref: '#/components/parameters/PageNumber'
