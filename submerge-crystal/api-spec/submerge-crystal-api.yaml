          $ref: '#/components/headers/X-RateLimit-Reset'
        X-Retry-After:
          $ref: '#/components/headers/X-Retry-After'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidParameter:
      description: Invalid path or query parameter(s).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ItemNotFound:
