openapi: 3.1.0
info:
  title: Submerge Crystal API v1
  description: |
    REST API for Submerge Crystal, the indexer component of Submerge.
    Submerge API comes with a set of five resources:
    - Blocks
    - Extrinsics
    - Calls
    - Events
    - Traces
  version: 1.0.0
  contact:
    name: Helikon Labs
    url: https://helikon.io
    email: info@helikon.io
  license:
    name: GPLv3
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: https://crystal.submerge.io/api/v1/{chain}
    description: Submerge Crystal API Server
    variables:
      chain:
        default: polkadot
        enum:
          - polkadot
          - asset-hub-polkadot
          - bridge-hub-polkadot
          - collectives-polkadot
          - coretime-polkadot
          - people-polkadot
          - kusama
          - asset-hub-kusama
          - bridge-hub-kusama
          - coretime-kusama
          - people-kusama

components:
  parameters:
    PageNumber:
      name: page_number
      in: query
      description: Page number to retrieve.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: page_size
      in: query
      description: Number of items per page to be returned.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    BlockRef:
      name: block_ref
      in: path
      required: true
      description: >
        Block reference. Either:
        - a block number (integer ≥ 0), or
        - a block hash in hex (with or without `0x` prefix, case-insensitive).
      schema:
        oneOf:
          - type: integer
            minimum: 0
            example: 1234567
          - type: string
            pattern: '^(0x)?[A-Fa-f0-9]{64}$'
            examples:
              - "0x91b171bb158e2d3848fa23a9f1c25182fb8e20313b2c1eb49219da7a70ce90c3"
              - "91B171BB158E2D3848FA23A9F1C25182FB8E20313B2C1EB49219DA7A70CE90C3"
    BlockStatus:
      name: status
      in: query
      required: false
      description: Filter blocks by status.
      schema:
        $ref: '#/components/schemas/BlockStatus'
  schemas:
    PaginationData:
      type: object
      description: Pagination data for paged responses.
      properties:
        pageNumber:
          type: integer
          description: Current page number.
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
          example: 1
        totalCount:
          type: integer
          description: Total number of items across all pages.
          minimum: 0
          example: 78
        hasNext:
          type: boolean
          description: Whether there is a next page.
          example: true
        hasPrevious:
          type: boolean
          description: Whether there is a previous page.
          example: false
      required:
        - pageNumber
        - pageSize
        - totalCount
        - hasNext
        - hasPrevious
      example:
        pageNumber: 1
        pageSize: 20
        totalCount: 78
        hasNext: true
        hasPrevious: false
    AccountIdHex:
      type: string
      pattern: '^0x[a-f0-9]{64}$'
      description: '32-byte Substrate account id encoded in hex.'
      example: '0x008d8404893c7b4b80f397605cc96e61fec3c89676c8c2794a2a7d281d678b1a'
    Hash256Hex:
      type: string
      pattern: '^0x[a-f0-9]{64}$'
      description: '32-byte Blake2b-256 hash, lowercase hex-encoded with `0x` prefix.'
      example: '0x91b171bb158e2d3848fa23a9f1c25182fb8e20313b2c1eb49219da7a70ce90c3'
    BlockStatus:
      type: string
      enum: [proposed, finalized, pruned]
      description: >
        Block status.
        - `finalized`: Blocks that have been finalized on chain.
        - `proposed`: Blocks that have been authored but not yet finalized.
        - `pruned`: Blocks that have been removed or are no longer accessible.
    Block:
      type: object
      description: A block in the blockchain
      tags:
        - block
      properties:
        hash:
          $ref: '#/components/schemas/Hash256Hex'
        parentHash:
          $ref: '#/components/schemas/Hash256Hex'
        stateRoot:
          $ref: '#/components/schemas/Hash256Hex'
        extrinsicRoot:
          $ref: '#/components/schemas/Hash256Hex'
        number:
          type: integer
          description: Block height.
          minimum: 0
          example: 20324123
        timestamp:
          type: integer
          description: Block timestamp - milliseconds.
          minimum: 0
          example: 1755773684012
        specVersion:
          type: integer
          minimum: 0
          description: Runtime spec version.
          example: 1001
        status:
          $ref: '#/components/schemas/BlockStatus'
        weight:
          type: object
          additionalProperties: true
          description: Block weight - varying schema depending on runtime version.
        extrinsicCount:
          type: integer
          minimum: 0
          description: Number of extrinsics in the block.
          example: 3
        eventCount:
          type: integer
          minimum: 0
          description: Number of events in the block.
          example: 12
        authorAccountId:
          $ref: '#/components/schemas/AccountIdHex'
          description: Author validator account id.
      required:
        - hash
        - parentHash
        - stateRoot
        - extrinsicRoot
        - number
        - timestamp
        - specVersion
        - status
        - weight
        - extrinsicCount
        - eventCount
        - authorAccountId
      example:
        hash: '0xc82fe0d5752d42ae3d325f14206859f86cec7447f244d5b4bccfc2a00bd58df8'
        parentHash: '0x1615581259dd1ac45fea1b23406367ca79c9f6dfa3b3b1115517c6e86250c42b'
        stateRoot: '0x8c8b0b599733c41bad79a617d8f2f0213a5d965d287cee16c9efd65f23001603'
        extrinsicRoot: '0x7893dd573a5033a6d785bf4038c237cbd8e1f3730d177d4f9b21c8d2c7b34454'
        number: 27419831
        timestamp: 1755773684012
        specVersion: 1006001
        status: 'finalized'
        weight:
          weight: 14
        extrinsicCount: 2
        eventCount: 56
        authorAccountId: '0x269a84431cd8dfc5762beadfa54a8f21597c12d4f31e51f9f6f985f65ba0c626'
    PaginatedBlockList:
      type: object
      description: List of blocks with pagination info.
      tags:
        - block
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Block'
          description: Array of blocks for the current page.
        pagination:
          $ref: '#/components/schemas/PaginationData'
      required:
        - data
        - pagination
      example:
        data:
          - hash: '0xc82fe0d5752d42ae3d325f14206859f86cec7447f244d5b4bccfc2a00bd58df8'
            parentHash: '0x1615581259dd1ac45fea1b23406367ca79c9f6dfa3b3b1115517c6e86250c42b'
            stateRoot: '0x8c8b0b599733c41bad79a617d8f2f0213a5d965d287cee16c9efd65f23001603'
            extrinsicRoot: '0x7893dd573a5033a6d785bf4038c237cbd8e1f3730d177d4f9b21c8d2c7b34454'
            number: 27419831
            timestamp: 1755773684012
            specVersion: 1006001
            status: 'finalized'
            weight:
              weight: 14
            extrinsicCount: 2
            eventCount: 56
            authorAccountId: '0x269a84431cd8dfc5762beadfa54a8f21597c12d4f31e51f9f6f985f65ba0c626'
        pagination:
          pageNumber: 1
          pageSize: 20
          totalCount: 78
          hasNext: true
          hasPrevious: false
  responses:
    ErrorResponse:
      description: Internal server error.
    PaginatedBlockListResponse:
      description: Response with a paginated list of blocks.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaginatedBlockList"
            
tags:
  - name: block
    description: Operations and items related to blocks.
  - name: trace
    description: Operations and items related to block traces.
  - name: call
    description: Operations and items related to calls in extrinsics.
  - name: extrinsic
    description: Operations and items related to extrinsics.
  - name: event
    description: Operations and items related to events.

paths:
  /blocks:
    get:
      summary: Get all blocks
      description: Returns all blocks from the database. It will return a paginated response, ordered ascending by block number.
      operationId: getAllBlocks
      tags:
        - block
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/BlockStatus'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedBlockListResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /blocks/{block_ref}:
    get:
      summary: Get block(s) by hash or number.
      description: >
        If a hash is passed, returns the matching block.
        If a number is given, gives the blocks by that number - could be pruned and/or finalized.
      operationId: getBlocksByHashOrNumber
      tags:
        - block
      parameters:
        - $ref: '#/components/parameters/BlockRef'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedBlockListResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
