[workspace]
members = [
    "submerge-api",
    "submerge-auth3",
    "submerge-base",
    "submerge-bloom",
    "submerge-cli",
    "submerge-cortex",
    "submerge-crystal",
    "submerge-fractal",
    "submerge-logging",
    "submerge-merkle-science-client",
    "submerge-metrics",
    "submerge-mycelium",
    "submerge-persistence",
    "submerge-reflex",
    "submerge-sentinel",
    "submerge-substrate-client",
    "submerge-util",
    "submerge-web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
rust-version = "1.83.0"
edition = "2021"
repository = "https://github.com/helikon-labs/submerge"
authors = ["kukabi <kutsal@helikon.io>"]
license = "GPL-3"

[workspace.dependencies]
actix-web = "4.11"
async-trait = "0.1"
anyhow = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
frame-metadata = "23.0"
frame-system = "40.1"
futures-util = "0.3"
env_logger = "0.11"
hex = "0.4"
jsonrpsee = "0.25"
jsonrpsee-core = "0.25"
lazy_static = "1.5"
log = "0.4"
once_cell = "1"
parity-scale-codec = "3.7"
prometheus = "0.14"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
sp-core = "36.1"
sp-runtime = "41.1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "macros", "runtime-tokio-native-tls"] }
strum = "0.27"
strum_macros = "0.27"
test-log = "0.2"
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
warp = { version = "0.3", default-features = false }