[workspace]
members = [
    "submerge-api",
    "submerge-auth",
    "submerge-base",
    "submerge-bloom",
    "submerge-cli",
    "submerge-config",
    "submerge-cortex",
    "submerge-crystal",
    "submerge-fractal",
    "submerge-logging",
    "submerge-metrics",
    "submerge-persistence",
    "submerge-reflex",
    "submerge-sentinel",
    "submerge-substrate-client",
    "submerge-types",
    "submerge-web",
]
resolver = "2"

[workspace.dependencies]
actix-web = "4.9"
async-trait = "0.1"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
config = "0.15"
frame-metadata = "18.0"
futures-util = "0.3"
env_logger = "0.11"
hex = "0.4"
jsonrpsee = "0.24"
jsonrpsee-core = "0.24"
jsonrpsee-types = "0.24"
lazy_static = "1.4"
log = "0.4"
once_cell = "1"
parity-scale-codec = "3.7"
prometheus = "0.13"
rustc-hash = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sp-core = "35.0"
sqlx = "0.8"
strum = "0.26"
strum_macros = "0.26"
test-log = "0.2.17"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }