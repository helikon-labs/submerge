[workspace]
members = [
    "submerge-api",
    "submerge-auth",
    "submerge-base",
    "submerge-bloom",
    "submerge-cli",
    "submerge-config",
    "submerge-cortex",
    "submerge-crystal",
    "submerge-fractal",
    "submerge-logging",
    "submerge-metrics",
    "submerge-persistence",
    "submerge-reflex",
    "submerge-sentinel",
    "submerge-substrate-client",
    "submerge-types",
    "submerge-web",
]
resolver = "2"

[workspace.dependencies]
actix-web = "4.9"
async-trait = "0.1"
anyhow = "1"
config = "0.15"
frame-metadata = { version = "18.0", features = ["std", "current", "legacy"] }
futures-util = "0.3"
env_logger = "0.11"
hex = "0.4"
jsonrpsee = "0.24"
jsonrpsee-core = "0.24"
jsonrpsee-types = "0.24"
lazy_static = "1.4"
log = "0.4"
once_cell = "1"
parity-scale-codec = "3.6"
prometheus = "0.13"
rustc-hash = "2.0"
scale-bits = "0.7.0"
scale-info = "2.11.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sp-core = "34.0"
sp-storage = "22.0.0"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono"] }
strum = "0.26"
strum_macros = "0.26"
thiserror = "2.0"
tokio = { version = "1.41", features = ["full"] }