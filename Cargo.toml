[workspace]
members = [
    "submerge-api",
    "submerge-auth3",
    "submerge-base",
    "submerge-bloom",
    "submerge-cli",
    "submerge-cortex",
    "submerge-crystal",
    "submerge-fractal",
    "submerge-metrics",
    "submerge-mycelium",
    "submerge-persistence",
    "submerge-reflex",
    "submerge-sentinel",
    "submerge-substrate-client",
    "submerge-util",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
rust-version = "1.83.0"
edition = "2021"
repository = "https://github.com/helikon-labs/submerge"
authors = ["kukabi <kutsal@helikon.io>"]
license = "GPL-3"

[workspace.dependencies]
async-recursion = "1.1.1"
async-trait = "0.1"
anyhow = "1"
axum = "0.8"
axum-embed = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["env", "derive"] }
convert_case = "0.10"
frame-metadata = { version = "23.0", default-features = true, features = ["legacy"] }
frame-system = "45.0"
futures = "0.3"
hex = "0.4"
jsonrpsee = { version = "0.26", features = ["full"] }
jsonrpsee-core = "0.26"
lru = "0.16"
once_cell = "1"
paste = "1.0"
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive", "full"] }
prometheus = "0.14"
reqwest = { version = "0.13", features = ["blocking", "json", "gzip", "brotli"] }
rust-embed = { version = "8.8", features = ["include-exclude"] }
rustc-hash = "2.1"
scale-decode = { git = "https://github.com/helikon-labs/scale-decode.git", branch = "submerge-expose-bitvector-format" }
scale-info = "2.11"
scale-type-resolver = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
serde_yaml = "0.9"
sp-consensus-babe = "0.46"
sp-core = "39.0"
sp-storage = "22.0"
sp-runtime = "45.0"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "macros", "runtime-tokio-native-tls"] }
strum = "0.27"
strum_macros = "0.27"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tokio-util = "0.7"
tower_governor = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
utoipa = { version = "5", features = ["axum_extras", "macros"] }
uuid = { version = "1.18", features = ["v4"] }
warp = { version = "0.4", features = ["server"] }